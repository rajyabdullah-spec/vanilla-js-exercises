<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus | Raji's Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="glass-panel text-center" id="main-container">
        <h1 class="status-label mb-2" id="timer-label">Session</h1>
        
        <div class="time-main" id="time-left">25:00</div>

        <div class="row mb-4">
            <div class="col-6">
                <p class="small text-uppercase opacity-75 mb-1">Break Length</p>
                <div class="d-flex align-items-center justify-content-center gap-2">
                    <button class="ctrl-btn" id="break-decrement">-</button>
                    <span id="break-length">5</span>
                    <button class="ctrl-btn" id="break-increment">+</button>
                </div>
            </div>
            <div class="col-6 border-start border-secondary border-opacity-25">
                <p class="small text-uppercase opacity-75 mb-1">Session Length</p>
                <div class="d-flex align-items-center justify-content-center gap-2">
                    <button class="ctrl-btn" id="session-decrement">-</button>
                    <span id="session-length">25</span>
                    <button class="ctrl-btn" id="session-increment">+</button>
                </div>
            </div>
        </div>

        <div class="controls d-flex gap-3 justify-content-center mt-3">
            <button id="start_stop" class="action-btn">Start</button>
            <button id="reset" class="action-btn outline">Reset</button>
        </div>
    </div>

    <audio id="beep" preload="auto" src="https://raw.githubusercontent.com/freeCodeCamp/cdn/master/build/testable-projects-fcc/audio/BeepSound.wav"></audio>

    <script src="script.js"></script>
</body>
</html>
